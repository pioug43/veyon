name: "CI Builds"
on:
  push:
    tags-ignore:
      - "v*.*.*"
    branches:
      - '**'

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    container: veyon/ci.linux.ubuntu.24.04
    env:
      CMAKE_FLAGS: -DWITH_TESTS=ON
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - run: .ci/linux.ubuntu.24.04/script.sh $GITHUB_WORKSPACE /tmp
      - run: ctest --test-dir /tmp --output-on-failure
      - uses: actions/upload-artifact@v6
        with:
          name: ubuntu-24.04-packages
          path: veyon*.deb

  # Compilation avec optimisation au lien, sur les chaînes d'outils les plus
  # anciennes.
  #
  # linux-build.sh n'active LTO que si CI_COMMIT_TAG est renseigné, donc
  # uniquement lors d'une publication : le reste du temps rien ne compile avec
  # LTO. Un défaut propre à ce mode restait donc invisible jusqu'à la
  # publication elle-même — c'est ainsi qu'une archive statique illisible par
  # « ar » ordinaire n'a été découverte qu'en produisant une version cassée
  # (v4.11.27, échec au lien de courserestrictions.so sur rhel.8).
  #
  # Deux distributions seulement, choisies pour leur binutils : ce sont les
  # plus anciennes, celles qui ne chargent pas le greffon LTO d'elles-mêmes.
  # Les récentes le font, ce qui masque précisément ce genre de défaut.
  build-linux-lto:
    strategy:
      # Sans cela, le premier échec annule les autres et on ne sait pas si le
      # problème est propre à une distribution — c'est ce qui s'est passé lors
      # de la publication ratée, où douze jobs sur treize ont été annulés.
      fail-fast: false
      matrix:
        dist:
          - rhel.8
          - debian.11
    runs-on: ubuntu-latest
    container: veyon/ci.linux.${{matrix.dist}}
    env:
      # Valeur factice : elle ne sert qu'à faire basculer le script en mode
      # publication (LTO=ON, RelWithDebInfo, traductions). Aucun artefact
      # n'est publié. Ne commence délibérément pas par « v » : CMakeLists.txt
      # ignore alors la valeur et retombe sur la version par défaut, donc
      # aucun paquet ne peut se faire passer pour une version publiée.
      CI_COMMIT_TAG: ci-lto-check
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - run: .ci/linux.${{matrix.dist}}/script.sh $GITHUB_WORKSPACE /tmp

  build-linux:
    strategy:
      matrix:
        dist:
          - debian.11
          - fedora.44
    runs-on: ubuntu-latest
    container: veyon/ci.linux.${{matrix.dist}}
    env:
      # Les tests tournent aussi ici, et pas seulement sur le job Ubuntu/Qt 6 :
      # c'est la seule couverture de Qt 5.15 (debian.11, GCC 10), où des
      # constructions C++17 et l'ambiguïté « = { a, b } » sur QStringList
      # échouent alors qu'elles passent sous Qt 6.
      CMAKE_FLAGS: -DWITH_TESTS=ON
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - run: .ci/linux.${{matrix.dist}}/script.sh $GITHUB_WORKSPACE /tmp
      # Pas de « ctest --test-dir » ici : Debian 11 embarque cmake 3.18, or
      # l'option n'existe que depuis cmake 3.20. Elle y serait ignorée en
      # silence, ctest tournerait dans le répertoire courant, ne trouverait
      # aucun test et sortirait malgré tout avec 0 — une étape qui passe
      # toujours sans rien vérifier. On se place donc dans le répertoire de
      # build, et on refuse explicitement un lot de tests vide.
      - name: Tests
        working-directory: /tmp
        run: |
          ctest -N | grep -qE "Total Tests: [1-9]" || { echo "Aucun test construit"; exit 1; }
          ctest --output-on-failure
